# The Gremlin on GitHub Actions
#
# GitHub Actions is not a real 24/7 host. One job can run for 6 hours max,
# then GitHub kills it. So this workflow runs the bot in polling mode and
# restarts it on a schedule, every 4 hours, so it is up most of the time
# with short gaps between runs.
#
# This only stays free if the repo is PUBLIC. Public repos get unlimited
# Actions minutes. A private repo on the free plan only gets 2,000
# minutes a month, and the bot would burn through that in about a day.
#
# Secrets to add in repo Settings > Secrets and variables > Actions
# (never put these in the code or in this file):
#   SLACK_BOT_TOKEN   (xoxb-...)
#   SLACK_APP_TOKEN   (xapp-..., only needed for Socket Mode, not polling)
#   LLM_API_KEY       (OpenRouter key, free models only)
#   GROQ_API_KEY      (Groq key, free tier, hard capped in the code)
#
# Note: each run starts fresh, so groq-usage.json does not carry over
# between runs. The in-code Groq caps (500/day, 20/min) still apply
# per run, and Groq itself will just refuse requests past its free tier.

name: gremlin

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 4 hours. GitHub cron runs in UTC.
    - cron: "0 */4 * * *"

jobs:
  run-gremlin:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # npm ci needs package-lock.json, which is too big to push through
        # the GitHub API from here, so install from package.json instead.
        run: npm install

      - name: Check tests pass
        run: npm test

      - name: Write env file from secrets
        run: |
          cat > .env <<EOF
          SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN=${{ secrets.SLACK_APP_TOKEN }}
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          LLM_MODEL=google/gemma-4-26b-a4b-it:free
          LLM_BASE_URL=https://openrouter.ai/api/v1
          LLM_FALLBACK_MODELS=inclusionai/ling-3.2-flash:free,particle-ai/particle-1:free,recursive/flint-v1.0:free,nvidia/nemotron-3.5-lightning:free,google/gemma-4-31b-it:free,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free,liquid/lfm-3-1.7b:free,baidu/ernie-5.5-flash-preview:free
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS=qwen/qwen3.8-27b,openai/gpt-oss-20b,openai/gpt-oss-120b
          GREMLIN_CHANNEL_ID=C0CLXF7ECRF
          GREMLIN_REPLY_TO_ALL=true
          GREMLIN_RANDOM_PER_DAY=3
          GREMLIN_THREAD_MEMORY=20
          GREMLIN_BOT_USER_ID=U0CM5DUJK7W
          EOF

      - name: Run The Gremlin (polling mode)
        # timeout stops the bot just before GitHub's job limit, and the
        # next scheduled run starts it again.
        run: timeout 225m npm run start:poll || true
